  <rect x="20" y="15" width="380" height="162" rx="10" fill="#161b22"/><text x="25" y="45" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">“The secret of perfect health lies in keeping the</text><text x="25" y="69" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">mind always cheerful - never worried, never hurried,</text><text x="25" y="93" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">never borne down by any fear, thought or anxiety.”</text><text x="395" y="145" text-anchor="end" font-size="13" font-style="italic" fill="#f06595">- Sathya Sai Baba</text>
