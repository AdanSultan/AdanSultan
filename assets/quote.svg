  <rect x="20" y="15" width="380" height="162" rx="10" fill="#161b22"/><text x="25" y="45" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">“There is no medicine like hope, no incentive so</text><text x="25" y="69" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">great, and no tonic so powerful as expectation of</text><text x="25" y="93" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">something tomorrow.”</text><text x="395" y="145" text-anchor="end" font-size="13" font-style="italic" fill="#f06595">- Orison Swett Marden</text>
