  <rect x="20" y="15" width="380" height="162" rx="10" fill="#161b22"/><text x="25" y="45" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">“Great leaders are almost always great simplifiers,</text><text x="25" y="69" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">who can cut through argument, debate and doubt, to</text><text x="25" y="93" font-size="14" font-style="italic" font-weight="600" fill="#7ee8c7">offer a solution everybody can understand.”</text><text x="395" y="145" text-anchor="end" font-size="13" font-style="italic" fill="#f06595">- Colin Powell</text>
